<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="LSKC. A timeline of our annual gathering, the same pose, and the memories in between. Together since 2013.">
  <title>LSKC — Our years together</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#timeline">Skip to our timeline</a>
  <header class="site-header wrap"><a class="brand" href="./" aria-label="LSKC home">LSKC<span>.</span></a><span class="header-note">Friends, since 2013 <span aria-hidden="true">♡</span></span></header>
  <main>
    <div class="intro wrap"><p class="eyebrow">ONE GATHERING. EVERY YEAR.</p><h1>Our years <em>together.</em></h1><p>Same friends. Same pose. All the little moments in between.</p></div>
    <nav class="year-nav" aria-label="Jump to a year"><div class="wrap"><div class="year-links" id="year-links"></div></div></nav>
    <div class="timeline-wrap wrap"><p id="timeline-status" class="timeline-status" role="status">Loading our memories…</p><div class="timeline" id="timeline" aria-label="Our memories, year by year"><div class="timeline-line" aria-hidden="true"><span id="timeline-progress"></span></div><div id="timeline-years"></div></div></div>
    <noscript><p class="wrap no-script">Please enable JavaScript to browse our yearly memories.</p></noscript>
  </main>
  <footer class="site-footer wrap"><p>LSKC <span aria-hidden="true">♡</span> <span id="year-range">2013–2026</span></p><span>More years. More memories.</span></footer>
  <dialog id="lightbox" class="lightbox" aria-label="Memory photo viewer"><div class="lightbox-top"><span id="lightbox-year"></span><button class="close-button" id="close-photo" aria-label="Close photo">×</button></div><figure><img id="lightbox-image" alt=""><figcaption id="lightbox-caption"></figcaption></figure><div class="lightbox-bottom"><button id="previous-photo">Previous</button><span id="lightbox-counter" aria-live="polite"></span><button id="next-photo">Next</button></div></dialog>
</body>
</html>
